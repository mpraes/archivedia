# archivedia — single-service Compose.
#
# This file intentionally does NOT define a postgres service. The
# application reuses the homelab PostgreSQL instance reachable through
# DATABASE_URL (see .env). The app container connects to it over the
# host network so it can reach the LAN address set in POSTGRES_HOST.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: archivedia:local
    container_name: archivedia
    env_file:
      - .env
    environment:
      # Force production-only behaviour inside the container even if
      # the host .env still says NODE_ENV=development for local tooling.
      NODE_ENV: production
    ports:
      - "3000:3000"
    restart: unless-stopped
    # The homelab Postgres lives on the LAN; bridge networking would
    # require extra DNS plumbing, so the simplest reliable option is
    # host networking. Drop this line and add `networks:` blocks if
    # the deployment moves to a docker network with a routable alias.
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
