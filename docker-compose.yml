# archivedia — single-service Compose.
#
# This file intentionally does NOT define a database service. The
# application connects to the MariaDB instance reachable through
# DATABASE_URL (see .env). Production deploys on Hostinger hit the
# managed MySQL/MariaDB over the public network; local dev can point
# DATABASE_URL at any reachable MySQL or MariaDB instance.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: archivedia:local
    container_name: archivedia
    env_file:
      - .env
    environment:
      # Force production-only behaviour inside the container even if
      # the host .env still says NODE_ENV=development for local tooling.
      NODE_ENV: production
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/health | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
